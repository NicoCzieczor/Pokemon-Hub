<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- PWA: Homescreen-App + Offline -->
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0d0f2b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PokéHub">
  <link rel="apple-touch-icon" href="../icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="../icons/splash-1320x2868.png">
  <link rel="apple-touch-startup-image" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="../icons/splash-1260x2736.png">
  <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="../icons/splash-1206x2622.png">
  <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="../icons/splash-1290x2796.png">
  <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="../icons/splash-1179x2556.png">
  <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="../icons/splash-1284x2778.png">
  <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="../icons/splash-1170x2532.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="../icons/splash-1125x2436.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="../icons/splash-1242x2688.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="../icons/splash-828x1792.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="../icons/splash-750x1334.png">
  <script src="../pwa.js"></script>
  <title>Typen-Rechner – Pokémon Hub</title>
  <style>
    :root {
      --bg: #0d0f2b;
      --surface: #191b3a;
      --surface-2: #20234a;
      --text: #e0e8f9;
      --accent: #ffda08;
      --blue: #57d2ff;
      --muted: #b1b3cc;
      --border: #303258;
      --soft-border: rgba(255,255,255,.09);
      --shadow: 0 22px 56px rgba(0,0,0,.22);
      --font: 'Segoe UI', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100%; font-family: var(--font);
      background:
        radial-gradient(circle at 15% 20%, rgba(87,210,255,.12), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(255,218,8,.10), transparent 28%),
        var(--bg);
      color: var(--text);
    }
    body { display: flex; justify-content: center; align-items: flex-start; padding: 28px 16px; }

    #app {
      width: min(98vw, 1340px);
      margin: 0 auto;
      padding: 24px;
      background: rgba(25, 27, 58, 0.96);
      border-radius: 28px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* ── Header ── */
    .hdr {
      width: 100%; max-width: none;
      display: flex; flex-direction: column; align-items: flex-start; gap: 6px; margin-bottom: 0;
    }
    h1 { font-size: clamp(1.85rem, 3vw, 2.45rem); font-weight: 900; color: #fff; letter-spacing: -.035em; }
    .hdr p { color: var(--muted); margin: 0; }
    .tool-nav {
      display: flex;
      align-items: center;
      gap: 18px;
      overflow-x: auto;
      min-height: 44px;
      padding: 0 4px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      scrollbar-width: thin;
    }
    #app > .tool-nav {
      margin: -24px -24px 0 -24px;
      padding: 0 28px;
      border-radius: 28px 28px 0 0;
      background: rgba(255, 255, 255, 0.04);
    }
    .tool-nav-link {
      position: relative;
      display: inline-flex;
      align-items: center;
      height: 42px;
      padding: 0 0 4px;
      color: rgba(224,232,249,0.78);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      transition: color 0.2s;
    }
    .tool-nav-link:hover { color: #f8fafc; text-decoration: none; }
    .tool-nav-link:first-child {
      gap: 7px;
      height: 34px;
      margin-right: 2px;
      padding: 0 12px 2px;
      color: #fff;
      border: 1px solid rgba(255,218,8,0.34);
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(255,218,8,0.18), rgba(87,210,255,0.10));
      box-shadow: 0 0 18px rgba(255,218,8,0.10), inset 0 1px 0 rgba(255,255,255,0.08);
      transition: color 0.2s, border-color 0.2s, background 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .tool-nav-link:first-child::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(255,218,8,0.55);
    }
    .tool-nav-link:first-child:hover {
      border-color: rgba(255,218,8,0.58);
      background: linear-gradient(135deg, rgba(255,218,8,0.24), rgba(87,210,255,0.15));
      box-shadow: 0 0 22px rgba(255,218,8,0.16), inset 0 1px 0 rgba(255,255,255,0.12);
      transform: translateY(-1px);
    }
    .tool-nav-link.is-active { color: #fff; pointer-events: none; }
    .tool-nav-link.is-active::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--blue));
      box-shadow: 0 0 10px rgba(87,210,255,0.28);
    }

    /* ── Wrapper ── */
    .wrap { width: 100%; max-width: none; display: flex; flex-direction: column; gap: 16px; }

    /* ── Selector card ── */
    .selector-card {
      background: rgba(25,27,58,.82);
      border: 1px solid var(--soft-border);
      border-radius: 22px; padding: 18px;
      display: grid;
      grid-template-columns: minmax(180px, 1.05fr) 72px minmax(320px, 1.75fr);
      align-items: stretch; gap: 14px;
    }
    .atk-col { display: flex; flex-direction: column; min-width: 0; }
    .vs-col {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; flex-shrink: 0; padding: 0 4px;
    }
    .vs-arrow { color: var(--blue); opacity: .72; filter: drop-shadow(0 0 12px rgba(87,210,255,.16)); }
    .vs-label { font-size: .62rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); opacity: .7; }
    .def-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-width: 0; }

    /* ── Slots ── */
    .slot {
      flex: 1; border: 1px dashed rgba(255,255,255,.18); border-radius: 16px;
      padding: 18px 14px 16px; min-height: 138px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; cursor: pointer; position: relative; overflow: hidden;
      background: rgba(255,255,255,.035);
      transition: border-color .2s, background .2s, box-shadow .2s, transform .2s;
    }
    .slot:hover { border-color: rgba(87,210,255,.45); background: rgba(87,210,255,.06); transform: translateY(-1px); }
    .slot.active {
      border-style: solid; border-color: var(--blue);
      background: rgba(87,210,255,.08);
      box-shadow: 0 0 0 3px rgba(87,210,255,.18), 0 16px 36px rgba(87,210,255,.08);
    }
    .slot.filled { border-style: solid; background: rgba(255,255,255,.05); }

    /* subtle colour wash behind the filled type */
    .slot-wash {
      position: absolute; inset: 0; border-radius: 16px;
      opacity: .16; pointer-events: none; transition: opacity .3s;
    }

    .slot-role {
      position: absolute; top: 10px; left: 12px;
      font-size: .64rem; font-weight: 800; letter-spacing: .11em;
      text-transform: uppercase; color: var(--muted); z-index: 1;
    }
    .slot-empty-icon { font-size: 2rem; opacity: .24; }
    .slot-hint { font-size: .82rem; color: var(--muted); text-align: center; line-height: 1.45; max-width: 160px; }

    .slot-pill {
      position: relative; z-index: 1;
      padding: 10px 24px; border-radius: 999px;
      font-size: 1.04rem; font-weight: 900; letter-spacing: 0;
      color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.55);
      margin-top: 8px;
      box-shadow: 0 10px 22px rgba(0,0,0,.20);
    }
    .slot-rm {
      position: relative; z-index: 1;
      background: rgba(0,0,0,.26); border: 1px solid rgba(255,255,255,.10);
      color: rgba(255,255,255,.68); font-size: .72rem; font-family: var(--font);
      padding: 4px 10px; border-radius: 999px; cursor: pointer;
      transition: color .15s, background .15s;
    }
    .slot-rm:hover { color: #fff; background: rgba(0,0,0,.5); }

    /* ── Grid card ── */
    .grid-card {
      background: rgba(25,27,58,.90);
      border: 1px solid var(--soft-border);
      border-radius: 18px; padding: 16px;
      box-shadow: 0 14px 34px rgba(0,0,0,.14);
    }
    .grid-hdr {
      font-size: .82rem; font-weight: 700; color: var(--muted);
      margin-bottom: 12px; min-height: 1.2em;
      transition: color .2s;
    }
    .grid-hdr b { color: var(--blue); font-weight: 700; }

    .type-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
      gap: 8px;
    }
    .chip {
      min-height: 36px;
      display: inline-flex; align-items: center; justify-content: center;
      padding: 7px 11px; border-radius: 11px; border: 1px solid rgba(255,255,255,.12);
      font-size: .82rem; font-weight: 800; cursor: pointer;
      color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.55);
      font-family: var(--font); user-select: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.13), 0 8px 16px rgba(0,0,0,.12);
      transition: transform .13s, border-color .13s, box-shadow .13s, opacity .15s, filter .13s;
    }
    .chip:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .chip:active { transform: translateY(0) scale(.96); }
    .chip.in-use {
      border-color: rgba(255,255,255,.75);
      box-shadow: 0 0 0 3px rgba(255,255,255,.16), 0 10px 20px rgba(0,0,0,.18);
    }
    .chip.no-slot { opacity: .55; }

    /* ── Results ── */
    .result-card {
      background: rgba(25,27,58,.92); border: 1px solid var(--soft-border);
      border-radius: 0 0 18px 18px; padding: 16px;
      box-shadow: 0 14px 34px rgba(0,0,0,.14);
      margin-bottom: 14px;
    }
    .result-title { font-size: 1rem; font-weight: 800; color: #fff; margin-bottom: 14px; }

    /* Big matchup banner */
    .matchup {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 12px 16px; margin-bottom: 0;
      background:
        linear-gradient(135deg, rgba(87,210,255,.08), rgba(255,218,8,.045)),
        rgba(25,27,58,.96);
      border: 1px solid rgba(87,210,255,.18);
      border-radius: 16px 16px 0 0;
      box-shadow: 0 14px 34px rgba(87,210,255,.08);
    }
    .matchup-flavor {
      width: 100%; text-align: center; font-size: .75rem; font-weight: 700;
      color: var(--muted); padding: 6px 0 0 0; letter-spacing: .02em;
      margin-top: 4px; border-top: 1px solid rgba(255,255,255,.08);
    }
    .matchup-move {
      font-size: .72rem; font-weight: 600; color: var(--muted);
      opacity: .8; font-style: italic; padding: 0 8px;
    }
    .matchup-sep { color: var(--muted); opacity: .6; }
    .big-mult {
      font-size: 2rem; font-weight: 950; line-height: 1;
      padding: 8px 18px; border-radius: 12px;
      margin-left: auto;
    }

    /* Mult colours (reused on both big-mult and tags) */
    .c4 { background: rgba(220,40,40,.2);   color: #ff5555; border: 1px solid rgba(220,40,40,.4); }
    .c2 { background: rgba(220,110,20,.2);  color: #ff9944; border: 1px solid rgba(220,110,20,.4); }
    .c1 { background: rgba(140,140,160,.15);color: #aaa;    border: 1px solid rgba(140,140,160,.25); }
    .ch { background: rgba(40,180,200,.15);  color: #40c8cc; border: 1px solid rgba(40,180,200,.3); }
    .cq { background: rgba(60,140,220,.15);  color: #68b0f5; border: 1px solid rgba(60,140,220,.3); }
    .c0 { background: rgba(70,70,90,.25);    color: #888;    border: 1px solid rgba(70,70,90,.4); }

    .rgroup {
      margin-bottom: 10px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.06);
      transition: opacity .2s;
    }
    .rgroup.optional { display: none; opacity: .7; }
    .rgroup.optional.show { display: block; }
    .rgroup:last-child { margin-bottom: 0; }
    .rgroup-hdr {
      display: flex; align-items: center; gap: 8px;
      font-size: .68rem; font-weight: 800; letter-spacing: .09em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
    }
    .expand-btn {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 12px; padding: 8px 14px;
      background: rgba(87,210,255,.12); border: 1px solid rgba(87,210,255,.25);
      border-radius: 10px; color: var(--blue); font-size: .78rem; font-weight: 700;
      cursor: pointer; transition: background .2s, border-color .2s;
    }
    .expand-btn:hover { background: rgba(87,210,255,.18); border-color: rgba(87,210,255,.4); }
    .expand-btn.open { background: rgba(87,210,255,.2); }
    .mtag {
      display: inline-block; padding: 3px 9px; border-radius: 8px;
      font-size: .78rem; font-weight: 800; letter-spacing: 0;
    }
    .badges { display: flex; flex-wrap: wrap; gap: 7px; }
    .tbadge {
      display: inline-flex; align-items: center;
      padding: 5px 12px; border-radius: 999px;
      font-size: .8rem; font-weight: 800;
      color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5);
      transition: box-shadow .15s, transform .15s;
    }
    .tbadge.hl { box-shadow: 0 0 0 3px rgba(255,255,255,.35); transform: scale(1.07); }

    .empty {
      text-align: center; padding: 44px 20px;
      color: var(--muted); font-size: .9rem; line-height: 1.7;
      background: rgba(25,27,58,.72);
      border: 1px dashed rgba(255,255,255,.14);
      border-radius: 18px;
    }

    /* ── Examples ── */
    .ex-section {
      background: rgba(25,27,58,.88); border: 1px solid var(--soft-border);
      border-radius: 18px; padding: 18px 20px;
    }
    .ex-title {
      font-size: .68rem; font-weight: 800; letter-spacing: .1em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 16px;
    }
    .ex-matchup {
      display: flex; align-items: center; gap: 14px;
    }
    .ex-side {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px;
      min-width: 0;
    }
    .ex-sprite {
      width: 88px; height: 88px; border-radius: 18px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.10);
      display: flex; align-items: center; justify-content: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
    }
    .ex-sprite img { width: 80px; height: 80px; image-rendering: pixelated; }
    .ex-sprite.placeholder { opacity: .3; }
    .ex-pname { font-weight: 700; font-size: .88rem; color: #fff; text-align: center; }
    .ex-ptypes { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
    .ex-type-tag {
      padding: 2px 8px; border-radius: 5px;
      font-size: .65rem; font-weight: 700;
      color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.45);
    }
    .ex-arrow-col {
      flex: 0 0 96px; display: flex; flex-direction: column;
      align-items: center; gap: 8px;
    }
    .ex-mult-pill {
      font-size: 1.05rem; font-weight: 900; padding: 4px 14px;
      border-radius: 8px; line-height: 1;
    }
    .ex-arrow-row {
      width: 100%; display: flex; align-items: center;
    }
    .ex-arrow-track { flex: 1; height: 2px; background: var(--muted); opacity: .3; }
    .ex-arrow-head { color: var(--muted); opacity: .45; font-size: .9rem; margin-left: 1px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ex-spin { display: inline-block; animation: spin 1s linear infinite; font-size: 1.5rem; opacity: .4; }

    .type-sprite {
      display: inline-block;
      background-image: url('./Types.png');
      background-repeat: no-repeat;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .lang-toggle {
      position: fixed;
      top: 16px; right: 16px;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--border, #303258);
      background: rgba(25,27,58,0.92);
      color: var(--muted, #b1b3cc);
      font-size: 0.78rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.06em;
      backdrop-filter: blur(8px);
      transition: border-color 0.2s, color 0.2s;
      z-index: 200;
    }
    .lang-toggle:hover {
      border-color: rgba(255,218,8,0.4);
      color: var(--accent, #ffda08);
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 8px; border: 2px solid var(--bg); }
    * { scrollbar-width: thin; scrollbar-color: var(--accent) var(--bg); }

    @media (max-width: 620px) {
      body { padding: 18px 10px; }
      #app { padding: 18px; border-radius: 22px; }
      .hdr { max-width: 100%; margin-bottom: 0; }
      .selector-card { grid-template-columns: 1fr; padding: 14px; }
      .vs-col { flex-direction: row; padding: 0; }
      .vs-arrow { transform: rotate(90deg); }
      .def-col { grid-template-columns: 1fr; }
      .type-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .big-mult { width: 100%; text-align: center; margin-left: 0; }
      .ex-matchup { align-items: stretch; }
      .tool-nav-link:first-child {
        height: 32px;
        padding-inline: 11px;
      }
    }
  </style>
</head>
<body>
<div id="app">

<button class="lang-toggle" id="lang-toggle">DE</button>

<nav class="tool-nav" aria-label="Pokemon tools">
  <a class="tool-nav-link" href="../index.html">Home</a>
  <a class="tool-nav-link" href="../RunDashboard/index.html">Run</a>
  <a class="tool-nav-link" href="../Pokelocke/index.html">Team</a>
  <a class="tool-nav-link" href="../Duo/index.html">Duo</a>
  <a class="tool-nav-link" href="../Trio/index.html">Trio</a>
  <a class="tool-nav-link" href="../Catchrate/index.html">Fangrate</a>
  <a class="tool-nav-link" href="../DamageCalc/index.html">Schaden</a>
  <a class="tool-nav-link is-active" href="index.html" aria-current="page">Typen</a>
  <a class="tool-nav-link" href="../PokemonInfo/index.html">Dex</a>
  <a class="tool-nav-link" href="../Rules/index.html">Regeln</a>
</nav>

<header class="hdr">
  <h1 data-i18n="title">Typen-Rechner</h1>
  <p data-i18n="subtitle">Berechne Typ-Effektivitäten schnell und vergleiche Matchups für beliebige Kombinationen.</p>
</header>

<div class="wrap">

  <!-- 3 slots -->
  <div class="selector-card">
    <div class="atk-col">
      <div class="slot" id="slot-atk" data-role="atk"></div>
    </div>
    <div class="vs-col">
      <svg class="vs-arrow" width="22" height="22" viewBox="0 0 22 22" fill="none">
        <path d="M4 11h14M11 5l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="vs-label">vs</span>
    </div>
    <div class="def-col">
      <div class="slot" id="slot-def1" data-role="def1"></div>
      <div class="slot" id="slot-def2" data-role="def2"></div>
    </div>
  </div>

  <!-- Type grid -->
  <div class="grid-card">
    <div class="grid-hdr" id="grid-hdr" data-i18n="gridHdr">Feld wählen, dann Typ antippen oder ziehen</div>
    <div class="type-grid" id="type-grid"></div>
  </div>

  <!-- Results -->
  <div id="results">
    <div class="empty" data-i18n="emptyInitial">Wähle einen Angriffstyp oder eine Verteidigungskombination.</div>
  </div>

</div>

</div>

<script>
window.LANG = localStorage.getItem('hub-lang') || 'de';
document.documentElement.lang = window.LANG;

const TRANSLATIONS = {
  de: {
    title: 'Typen-Rechner',

function ROLE_DE(role) {

}
function ROLE_HINT(role) {
  const map = {

}

const CHART = {
  Normal:   { Rock:.5, Ghost:0, Steel:.5 },
  Fire:     { Fire:.5, Water:.5, Grass:2, Ice:2, Bug:2, Rock:.5, Dragon:.5, Steel:2 },
  Water:    { Fire:2, Water:.5, Grass:.5, Ground:2, Rock:2, Dragon:.5 },

// ── Type Icons (Sprite-Sheet: 5 cols × 4 rows, 1080×956 px, cell 216×239) ─────
const TYPE_SPRITE_POS = {
  Grass:    [0, 0], Fire:     [1, 0], Water:    [2, 0], Electric: [3, 0], Normal:   [4, 0],
  Fighting: [0, 1], Dark:     [1, 1], Steel:    [2, 1], Dragon:   [3, 1], Fairy:    [4, 1],
  Bug:      [0, 2], Flying:   [1, 2], Ghost:    [2, 2], Poison:   [3, 2], Psychic:  [4, 2],
  Ground:   [0, 3], Rock:     [1, 3], Ice:      [3, 3],
};

// Measured icon centre within each 216×239 cell (alpha-channel bounding box midpoint)
const ICON_CENTER = {
  Grass:[115,109], Fire:[103.5,111], Water:[115,110.5], Electric:[112,111], Normal:[104.5,110],
  Fighting:[114,108], Dark:[106,107], Steel:[113.5,108], Dragon:[112,108], Fairy:[104,108],
  Bug:[111,102.5], Flying:[105,102], Ghost:[114,101.5], Poison:[113,103], Psychic:[105,105],
  Ground:[108,96.5], Rock:[104,94], Ice:[116,95.5],
};

function typeIconHTML(type, size = 48) {
  const [col, row] = TYPE_SPRITE_POS[type] ?? [0, 0];
  const [cx, cy]   = ICON_CENTER[type] ?? [108, 119];
  const ICON_PX = 144;
  const half    = size / 2;
  const bsW     = Math.round(1080 * size * 0.75 / ICON_PX);
  const bsH     = Math.round(956  * size * 0.75 / ICON_PX);
  const rx      = bsW / 1080;
  const ry      = bsH / 956;
  const bpX     = half - (col * 216 + cx) * rx;
  const bpY     = half - (row * 239 + cy) * ry;
  return `<span class="type-sprite" style="width:${size}px;height:${size}px;background-size:${bsW}px ${bsH}px;background-position:${bpX}px ${bpY}px"></span>`;
}

const randomType = TYPES[Math.floor(Math.random() * TYPES.length)];

function eff(atk, def) { return CHART[atk]?.[def] ?? 1; }

function mCls(m) {
  return { 4:'c4', 2:'c2', 1:'c1', .5:'ch', .25:'cq', 0:'c0' }[m] ?? 'c1';
}
function mLbl(m) {
  return { 4:'4×', 2:'2×', 1:'1×', .5:'½×', .25:'¼×', 0:'0×' }[m] ?? `${m}×`;
}

// ── State ────────────────────────────────────────────────────────────────────
const state = { atk: null, def1: null, def2: null };
let activeRole = null;

// ── Slot rendering ────────────────────────────────────────────────────────────
function renderSlot(role) {
  const el = document.getElementById(`slot-${role}`);
  const type = state[role];
  const isActive = activeRole === role;

  el.className = 'slot' + (isActive ? ' active' : '') + (type ? ' filled' : '');
  if (type) el.style.borderColor = COL[type];
  else el.style.borderColor = '';

  if (type) {
    el.innerHTML = `
      <div class="slot-wash" style="background:${COL[type]}"></div>
      <span class="slot-role">${ROLE_DE(role)}</span>
      <span class="slot-pill" style="background:${COL[type]}">${typeName(type)}</span>
      <button class="slot-rm" data-role="${role}">${window.LANG === 'en' ? 'Clear' : 'Leeren'}</button>`;
    el.querySelector('.slot-rm').addEventListener('click', e => {
      e.stopPropagation();
      state[role] = null;
      renderSlot(role);
      updateGrid();
      renderResults();
    });
  } else {
    const iconHTML = role === 'atk'
      ? typeIconHTML(randomType, 48)
      : `<svg width="36" height="36" viewBox="0 0 32 32" fill="none" style="opacity:.35"><path d="M16 3L4 8v9c0 6.5 5 12.5 12 14.3C23 29.5 28 23.5 28 17V8L16 3z" stroke="currentColor" stroke-width="2" fill="rgba(255,255,255,.12)"/></svg>`;
    el.innerHTML = `
      <span class="slot-role">${ROLE_DE(role)}</span>
      <span class="slot-empty-icon">${iconHTML}</span>
      <span class="slot-hint">${ROLE_HINT(role)}</span>`;
  }
}

['atk','def1','def2'].forEach(role => {
  const el = document.getElementById(`slot-${role}`);
  el.addEventListener('click', () => {
    activeRole = activeRole === role ? null : role;
    ['atk','def1','def2'].forEach(renderSlot);
    updateGrid();
  });
  el.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (!state[role]) return;
    state[role] = null;
    if (activeRole === role) activeRole = null;
    renderSlot(role);
    updateGrid();
    renderResults();
  });
});

// ── Grid ─────────────────────────────────────────────────────────────────────
function buildGrid() {
  const grid = document.getElementById('type-grid');
  TYPES.forEach(t => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = typeName(t);
    chip.style.backgroundColor = COL[t];
    chip.dataset.type = t;
    chip.draggable = true;

    chip.addEventListener('click', () => {
      if (!activeRole) return;
      state[activeRole] = state[activeRole] === t ? null : t;
      // auto-advance: atk → def1 → def2 → null
      if (state[activeRole] !== null) {
        const next = { atk:'def1', def1:'def2', def2:null }[activeRole];
        activeRole = next;
      }
      ['atk','def1','def2'].forEach(renderSlot);
      updateGrid();
      renderResults();
    });

    chip.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', t);
      e.dataTransfer.effectAllowed = 'copy';
      // drag always works regardless of activeRole
    });

    grid.appendChild(chip);
  });
}

function updateGrid() {
  const used = new Set([state.atk, state.def1, state.def2].filter(Boolean));
  const hdr = document.getElementById('grid-hdr');

  if (!activeRole) {
    hdr.innerHTML = window.LANG === 'en'
      ? 'Select a slot, then tap a type or <b>drag</b> it onto a slot'
      : 'Feld wählen, dann Typ antippen oder auf ein Feld <b>ziehen</b>';
  } else {
    hdr.innerHTML = window.LANG === 'en'
      ? `Choose type for <b>${ROLE_DE(activeRole)}</b>`
      : `Typ für <b>${ROLE_DE(activeRole)}</b> wählen`;
  }

  document.querySelectorAll('.chip').forEach(chip => {
    const t = chip.dataset.type;
    chip.classList.toggle('in-use', used.has(t));
  });
}

// Drag onto slots
['atk','def1','def2'].forEach(role => {
  const el = document.getElementById(`slot-${role}`);
  el.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; el.classList.add('active'); });
  el.addEventListener('dragleave', () => { if (activeRole !== role) el.classList.remove('active'); });
  el.addEventListener('drop', e => {
    e.preventDefault();
    const t = e.dataTransfer.getData('text/plain');
    if (!t) return;
    state[role] = t;
    if (activeRole === role) activeRole = null;
    ['atk','def1','def2'].forEach(renderSlot);
    updateGrid();
    renderResults();
  });
});

// ── Results ───────────────────────────────────────────────────────────────────
function badge(type, highlight = false) {
  return `<span class="tbadge${highlight ? ' hl' : ''}" style="background:${COL[type]}">${typeName(type)}</span>`;
}

function renderResults() {
  const { atk, def1, def2 } = state;
  const res = document.getElementById('results');

  if (!atk && !def1 && !def2) {
    res.innerHTML = `<div class="empty">${window.LANG === 'en' ? 'Fill at least one slot to see the result.' : 'Befülle mindestens ein Feld, um das Ergebnis zu sehen.'}</div>`;
    return;
  }

  let html = '';

  // Matchup banner when both sides filled
  if (atk && (def1 || def2)) {
    const defs = [def1, def2].filter(Boolean);
    const m = defs.reduce((acc, d) => acc * eff(atk, d), 1);
    const cls = mCls(m);
    const defPills = defs.map(t => `<span class="tbadge" style="background:${COL[t]}">${typeName(t)}</span>`).join(
      `<span style="color:var(--muted);font-size:.8rem;margin:0 2px">/</span>`
    );
    
    const flavorMap = window.LANG === 'en'
      ? { 4:'Devastating hit!', 2:'Hits twice as hard', 1:'Normal effectiveness', .5:'Not very effective', .25:'Barely effective', 0:'No effect' }
      : { 4:'Verheerender Treffer!', 2:'Trifft doppelt so stark', 1:'Normale Wirkung', .5:'Trifft nur halb so stark', .25:'Kaum wirksam', 0:'Keine Wirkung' };
    const flavor = flavorMap[m] ?? (window.LANG === 'en' ? `Hits ${m}× hard` : `Trifft ${m}× stark`);
    
    const moveList = MOVES[atk] || [];
    const move = moveList[Math.floor(Math.random() * moveList.length)] || 'Attacke';
    
    html += `<div class="matchup">
      <span class="tbadge" style="background:${COL[atk]}">${typeName(atk)}</span>
      <span class="matchup-sep">→</span>
      <span class="matchup-move">${move}</span>
      <span class="matchup-sep">→</span>
      ${defPills}
      <span class="big-mult ${cls}">${mLbl(m)}</span>
      <div class="matchup-flavor">${flavor}</div>
    </div>`;
  }

  // Defense chart
  if (def1 || def2) {
    const defs = [def1, def2].filter(Boolean);
    const groups = {};
    TYPES.forEach(a => {
      const m = defs.reduce((acc, d) => acc * eff(a, d), 1);
      (groups[m] ??= []).push(a);
    });

    const defName = defs.map(t => typeName(t)).join(' / ');
    html += `<div class="result-card"><div class="result-title">${window.LANG === 'en' ? 'Effectiveness against' : 'Effektivität gegen'} <b>${defName}</b></div>`;

    const important = window.LANG === 'en'
      ? [[4,'Extremely effective'],[2,'Super effective'],[0,'No effect'],[.25,'Barely effective']]
      : [[4,'Extrem effektiv'],[2,'Sehr effektiv'],[0,'Keine Wirkung'],[.25,'Kaum wirksam']];
    const optional = window.LANG === 'en'
      ? [[.5,'Not very effective'],[1,'Normal effectiveness']]
      : [[.5,'Wenig wirksam'],[1,'Normale Wirkung']];
    let hasOptional = false;

    important.forEach(([m, lbl]) => {
      if (!groups[m]?.length) return;
      html += `<div class="rgroup">
        <div class="rgroup-hdr"><span class="mtag ${mCls(m)}">${mLbl(m)}</span>${lbl}</div>
        <div class="badges">${groups[m].map(t => badge(t, t === atk)).join('')}</div>
      </div>`;
    });

    optional.forEach(([m, lbl]) => {
      if (!groups[m]?.length) return;
      hasOptional = true;
      html += `<div class="rgroup optional">
        <div class="rgroup-hdr"><span class="mtag ${mCls(m)}">${mLbl(m)}</span>${lbl}</div>
        <div class="badges">${groups[m].map(t => badge(t, t === atk)).join('')}</div>
      </div>`;
    });

    if (hasOptional) {
      html += `<button class="expand-btn" data-expand="defense"><span>${window.LANG === 'en' ? '+ Show all types' : '+ Alle Typen anzeigen'}</span></button>`;
    }
    html += `</div>`;

  } else if (atk) {
    // Only attack
    const groups = {};
    TYPES.forEach(d => { const m = eff(atk, d); (groups[m] ??= []).push(d); });

    html += `<div class="result-card"><div class="result-title"><b>${typeName(atk)}</b>${window.LANG === 'en' ? '-type move against…' : '-Attacke gegen …'}</div>`;
    const important = window.LANG === 'en'
      ? [[2,'Super effective'],[0,'No effect']]
      : [[2,'Sehr effektiv'],[0,'Keine Wirkung']];
    const optional = window.LANG === 'en'
      ? [[.5,'Not very effective'],[1,'Normal effectiveness']]
      : [[.5,'Wenig wirksam'],[1,'Normale Wirkung']];
    let hasOptional = false;

    important.forEach(([m, lbl]) => {
      if (!groups[m]?.length) return;
      html += `<div class="rgroup">
        <div class="rgroup-hdr"><span class="mtag ${mCls(m)}">${mLbl(m)}</span>${lbl}</div>
        <div class="badges">${groups[m].map(t => badge(t)).join('')}</div>
      </div>`;
    });

    optional.forEach(([m, lbl]) => {
      if (!groups[m]?.length) return;
      hasOptional = true;
      html += `<div class="rgroup optional">
        <div class="rgroup-hdr"><span class="mtag ${mCls(m)}">${mLbl(m)}</span>${lbl}</div>
        <div class="badges">${groups[m].map(t => badge(t)).join('')}</div>
      </div>`;
    });

    if (hasOptional) {
      html += `<button class="expand-btn" data-expand="attack"><span>${window.LANG === 'en' ? '+ Show all types' : '+ Alle Typen anzeigen'}</span></button>`;
    }
    html += `</div>`;
  }

  // Examples shell (filled async)
  const hasAtk = !!atk, hasDef = !!(def1 || def2);
  if (hasAtk || hasDef) {
    const mult = (atk && (def1||def2))
      ? [def1,def2].filter(Boolean).reduce((acc,d) => acc * eff(atk,d), 1) : null;
    const multHTML = mult !== null
      ? `<span class="ex-mult-pill ${mCls(mult)}">${mLbl(mult)}</span>` : '';
    html += `<div class="ex-section">
      <div class="ex-title">${window.LANG === 'en' ? 'Example Matchup' : 'Beispiel-Matchup'}</div>
      <div class="ex-matchup">
        <div id="ex-atk-side" class="ex-side">${hasAtk ? exLoading() : exEmpty()}</div>
        <div class="ex-arrow-col">${multHTML}<div class="ex-arrow-row"><div class="ex-arrow-track"></div><span class="ex-arrow-head">▶</span></div></div>
        <div id="ex-def-side" class="ex-side">${hasDef ? exLoading() : exEmpty()}</div>
      </div>
    </div>`;
  }

  res.innerHTML = html;
  
  // Attach expand button handlers
  document.querySelectorAll('.expand-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const card = btn.parentElement;
      const optionalGroups = card.querySelectorAll('.rgroup.optional');
      const isOpen = btn.classList.toggle('open');
      optionalGroups.forEach(g => g.classList.toggle('show', isOpen));
      btn.innerHTML = isOpen
        ? `<span>${window.LANG === 'en' ? '− Show less' : '− Weniger anzeigen'}</span>`
        : `<span>${window.LANG === 'en' ? '+ Show all types' : '+ Alle Typen anzeigen'}</span>`;
    });
  });

  if (hasAtk || hasDef) { exVer++; loadExamples(exVer); }
}

// ── Examples (PokéAPI) ────────────────────────────────────────────────────────
const typeCache = {};
let exVer = 0;

function exLoading() {
  return `<div class="ex-sprite placeholder"><span class="ex-spin">↻</span></div>
    <span class="ex-pname" style="color:var(--muted);font-size:.72rem">${window.LANG === 'en' ? 'Loading…' : 'Lädt…'}</span>`;
}
function exEmpty() {
  return `<div class="ex-sprite placeholder"><span style="font-size:1.6rem;opacity:.3">?</span></div>
    <span class="ex-pname" style="color:var(--muted)">—</span>`;
}
function exFilled(p) {
  const types = p.types.map(t =>
    `<span class="ex-type-tag" style="background:${COL[t]??'#888'}">${typeName(t)}</span>`
  ).join('');
  return `<div class="ex-sprite"><img src="${p.sprite}" alt="${p.name}" width="80" height="80"></div>
    <span class="ex-pname">${p.name}</span>
    <div class="ex-ptypes">${types}</div>`;
}

async function getTypePool(type) {
  if (typeCache[type]) return typeCache[type];
  try {
    const d = await (await fetch(`https://pokeapi.co/api/v2/type/${type.toLowerCase()}`)).json();
    const pool = d.pokemon.map(e => e.pokemon).filter(p => {
      const id = +p.url.split('/').filter(Boolean).pop();
      return id >= 1 && id <= 649;
    });
    typeCache[type] = pool;
    return pool;
  } catch { return []; }
}

async function fetchExamplePoke(types) {
  const lists = await Promise.all(types.map(getTypePool));
  let pool = lists[0] ?? [];
  if (lists.length > 1 && lists[1]?.length) {
    const s = new Set(lists[1].map(p => p.name));
    const exact = pool.filter(p => s.has(p.name));
    if (exact.length) pool = exact;
  }
  if (!pool.length) return null;
  const pick = pool[Math.floor(Math.random() * Math.min(pool.length, 80))];
  const id = +pick.url.split('/').filter(Boolean).pop();
  try {
    const d = await (await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`)).json();
    return {
      name: d.name.split('-').map(w => w.charAt(0).toUpperCase()+w.slice(1)).join('-'),
      sprite: d.sprites.front_default ?? `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`,
      types: d.types.map(t => t.type.name.charAt(0).toUpperCase()+t.type.name.slice(1))
    };
  } catch { return null; }
}

async function loadExamples(ver) {
  const { atk, def1, def2 } = state;
  const defTypes = [def1, def2].filter(Boolean);
  const [atkPoke, defPoke] = await Promise.all([
    atk ? fetchExamplePoke([atk]) : Promise.resolve(null),
    defTypes.length ? fetchExamplePoke(defTypes) : Promise.resolve(null),
  ]);
  if (ver !== exVer) return;
  const atkEl = document.getElementById('ex-atk-side');
  const defEl = document.getElementById('ex-def-side');
  if (atkEl) atkEl.innerHTML = atkPoke ? exFilled(atkPoke) : exEmpty();
  if (defEl) defEl.innerHTML = defPoke ? exFilled(defPoke) : exEmpty();
}

// ── i18n ─────────────────────────────────────────────────────────────────────
function applyLang() {
  const t = TRANSLATIONS[window.LANG] || TRANSLATIONS.de;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (t[key] !== undefined) el.textContent = t[key];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.dataset.i18nPlaceholder;
    if (t[key] !== undefined) el.placeholder = t[key];
  });
  document.getElementById('lang-toggle').textContent = window.LANG.toUpperCase();
  // Re-render all slots and grid to update bilingual strings
  ['atk','def1','def2'].forEach(renderSlot);
  document.querySelectorAll('.chip[data-type]').forEach(c => { c.textContent = typeName(c.dataset.type); });
  updateGrid();
  // Re-render results if something is filled
  if (state.atk || state.def1 || state.def2) renderResults();
}

// ── Init ──────────────────────────────────────────────────────────────────────
['atk','def1','def2'].forEach(renderSlot);
buildGrid();
updateGrid();

document.getElementById('lang-toggle').addEventListener('click', () => {
  window.LANG = window.LANG === 'de' ? 'en' : 'de';
  localStorage.setItem('hub-lang', window.LANG);
  document.documentElement.lang = window.LANG;
  applyLang();
});
applyLang();
</script>
</body>
</html>
