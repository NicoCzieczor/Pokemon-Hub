<header>
  <h1 data-i18n="title">Typen-Rechner</h1>
  <p data-i18n="subtitle">Schwächen, Resistenzen und Matchups für jede Typ-Kombination – passend zur Generation.</p>
</header>

<main>

  <!-- Generation, Felder und Typen in einer Karte -->
  <section class="picker">
    <div class="gen-row">
      <span class="setup-label" data-i18n="genLabel">Generation</span>
      <div class="gen-chips" id="gen-chips" role="radiogroup" aria-label="Generation">
        <button type="button" class="gen-chip" data-gen="1">1</button>
        <button type="button" class="gen-chip" data-gen="2">2</button>
        <button type="button" class="gen-chip" data-gen="3">3</button>
        <button type="button" class="gen-chip" data-gen="4">4</button>
        <button type="button" class="gen-chip" data-gen="5">5</button>
        <button type="button" class="gen-chip" data-gen="6">6</button>
        <button type="button" class="gen-chip" data-gen="7">7</button>
        <button type="button" class="gen-chip" data-gen="8">8</button>
        <button type="button" class="gen-chip" data-gen="9">9</button>
      </div>
      <p class="gen-info" id="gen-info"></p>
    </div>

    <div class="slots">
      <div class="slot" id="slot-atk" data-role="atk" role="button" tabindex="0"></div>
      <span class="slots-arrow" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 11h14M11 5l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <div class="slot" id="slot-def1" data-role="def1" role="button" tabindex="0"></div>
      <div class="slot" id="slot-def2" data-role="def2" role="button" tabindex="0"></div>
    </div>

    <p class="grid-hint" id="grid-hint"></p>
    <div class="type-grid" id="type-grid"></div>
  </section>

  <div id="results"></div>

</main>

</div>

<!-- Typentabellen je Generation – dieselben wie im Schadens-Rechner -->
<script src="../DamageCalc/mechanics.js"></script>
<script src="app.js"></script>
</body>
</html>
