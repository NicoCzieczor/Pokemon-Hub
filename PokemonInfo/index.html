<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- PWA: Homescreen-App + Offline -->
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0d0f2b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PokéHub">
  <link rel="apple-touch-icon" href="../icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="../icons/splash-1320x2868.png">
  <link rel="apple-touch-startup-image" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="../icons/splash-1260x2736.png">
  <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="../icons/splash-1206x2622.png">
  <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="../icons/splash-1290x2796.png">
  <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="../icons/splash-1179x2556.png">
  <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="../icons/splash-1284x2778.png">
  <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="../icons/splash-1170x2532.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="../icons/splash-1125x2436.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="../icons/splash-1242x2688.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="../icons/splash-828x1792.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="../icons/splash-750x1334.png">
  <script src="../pwa.js"></script>
  <link rel="stylesheet" href="../theme.css">
  <title>Pokédex – Pokémon Hub</title>
  <link rel="stylesheet" href="../Pokelocke/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <nav class="tool-nav" aria-label="Pokémon tools">
    <a class="tool-nav-link" href="../index.html" data-i18n="nav.home">Home</a>
    <a class="tool-nav-link" href="../RunDashboard/index.html" data-i18n="nav.run">Run</a>
    <a class="tool-nav-link" href="../Pokelocke/index.html" data-i18n="nav.team">Team</a>
    <a class="tool-nav-link" href="../Duo/index.html">Duo</a>
    <a class="tool-nav-link" href="../Trio/index.html" data-i18n="nav.trio">Trio</a>
    <a class="tool-nav-link" href="../Catchrate/index.html" data-i18n="nav.catchrate">Fangrate</a>
    <a class="tool-nav-link" href="../DamageCalc/index.html" data-i18n="nav.damage">Schaden</a>
    <a class="tool-nav-link" href="../Typrechner/index.html" data-i18n="nav.types">Typen</a>
    <a class="tool-nav-link is-active" href="index.html" aria-current="page" data-i18n="nav.info">Dex</a>
    <a class="tool-nav-link" href="../Karte/index.html" data-i18n="nav.map">Karte</a>
    <a class="tool-nav-link" href="../Bosse/index.html">Bosse</a>
    <a class="tool-nav-link" href="../SaveViewer/index.html">Save</a>
    <a class="tool-nav-link" href="../Sonderbonbons/index.html">Bonbons</a>
    <a class="tool-nav-link" href="../Randomizer/index.html">Randomizer</a>
    <a class="tool-nav-link" href="../Rules/index.html">Regeln</a>
  </nav>

  <header>
    <div class="header-copy">
      <h1 data-i18n="title">Pokédex</h1>
      <p data-i18n="subtitle">Vollständige Informationen zu jedem Pokémon</p>
    </div>
    <button id="lang-toggle" class="lang-toggle" type="button">DE</button>
  </header>

  <!-- Suche + Spiel: das Spiel gilt für Entwicklung, Attacken und Fundorte -->
  <div class="top-controls">
    <button id="search-trigger" class="search-trigger" type="button">
      <span class="search-icon">🔍</span>
      <span id="search-trigger-label" data-i18n="searchPlaceholder">Pokémon suchen...</span>
    </button>
    <label class="game-bar">
      <span class="game-bar-label"><span data-i18n="gameLabel">Spiel</span> <small data-i18n="gameHint">gilt für Entwicklung, Attacken und Fundorte</small></span>
      <select id="version-select" class="version-select"></select>
    </label>
  </div>

  <div id="pokemon-content" style="display:none">

    <!-- Identity -->
    <section class="card" id="section-identity">
      <div class="section-kicker" data-i18n="sectionIdentity">Pokémon</div>
      <div class="identity-layout">
        <div class="identity-sprite-wrap">
          <img id="identity-sprite" class="identity-sprite" src="" alt="">
          <button id="shiny-btn" class="shiny-btn" type="button">✨ Shiny</button>
        </div>
        <div class="identity-info">
          <div class="identity-name-row">
            <span id="identity-name" class="identity-name">—</span>
            <span id="identity-name-en" class="identity-name-en"></span>
          </div>
          <div class="identity-meta">
            <span id="identity-id">#000</span>
            <span id="identity-gen"></span>
            <span id="identity-size"></span>
          </div>
          <div id="identity-genera" class="identity-genera"></div>
          <div id="identity-types" class="identity-types"></div>
          <div class="identity-quick-stats" id="identity-quick-stats"></div>
          <div id="identity-flavor" class="flavor-text" style="display:none"></div>
        </div>
      </div>
    </section>

    <!-- Stats + Type effectiveness -->
    <div class="two-col">
      <section class="card" id="section-stats">
        <div class="section-kicker" data-i18n="sectionStats">Basiswerte</div>
        <div id="stats-content" class="stat-rows"></div>
      </section>
      <section class="card" id="section-effectiveness">
        <div class="section-kicker" data-i18n="sectionEffectiveness">Typeffektivität</div>
        <div id="effectiveness-content" class="eff-groups"></div>
      </section>
    </div>

    <!-- Abilities -->
    <section class="card" id="section-abilities">
      <div class="section-kicker" data-i18n="sectionAbilities">Fähigkeiten</div>
      <div id="abilities-content" class="abilities-list"><div class="loading-row"><span class="loading-spinner"></span></div></div>
    </section>

    <!-- Evolution -->
    <section class="card" id="section-evolution">
      <div class="section-kicker" data-i18n="sectionEvolution">Entwicklung</div>
      <div id="evolution-content" class="evo-chain"><div class="loading-row"><span class="loading-spinner"></span></div></div>
    </section>

    <!-- Forms -->
    <section class="card" id="section-forms" style="display:none">
      <div class="section-kicker" data-i18n="sectionForms">Formen</div>
      <div id="forms-content" class="forms-list"></div>
    </section>

    <!-- Moves -->
    <section class="card" id="section-moves">
      <div class="section-kicker" data-i18n="sectionMoves">Attacken</div>
      <div class="moves-controls">
        <div id="method-tabs" class="method-tabs"></div>
      </div>
      <div id="moves-content" class="moves-table-wrap"><div class="loading-row"><span class="loading-spinner"></span></div></div>
    </section>

    <!-- Locations -->
    <section class="card" id="section-locations">
      <div class="section-kicker" data-i18n="sectionLocations">Fundorte</div>
      <div class="locations-controls">
        <select id="location-game-select" class="version-select"></select>
      </div>
      <div id="locations-content"><div class="loading-row"><span class="loading-spinner"></span></div></div>
    </section>

    <!-- Species details -->
    <section class="card" id="section-details">
      <div class="section-kicker" data-i18n="sectionDetails">Spezies-Daten</div>
      <div id="details-content" class="details-grid"></div>
    </section>

  </div>
</div>

<!-- Pokémon picker modal -->
<div id="pokemon-modal" class="pokemon-modal">
  <div class="pokemon-modal-content">
    <div class="modal-header">
      <h2 data-i18n="modalTitle">Pokémon auswählen</h2>
      <button id="close-modal" class="icon-btn" type="button">&#215;</button>
    </div>
    <div class="modal-controls">
      <select id="modal-gen">
        <option value="1">Gen 1</option>
        <option value="2">Gen 2</option>
        <option value="3">Gen 3</option>
        <option value="4">Gen 4</option>
        <option value="5">Gen 5</option>
        <option value="6">Gen 6</option>
        <option value="7">Gen 7</option>
        <option value="8">Gen 8</option>
        <option value="9">Gen 9</option>
      </select>
      <input id="modal-search" type="search" placeholder="Suchen..." autocomplete="off" data-i18n-placeholder="modalSearch">
    </div>
    <ul id="pokemon-grid"></ul>
  </div>
</div>


<div id="move-detail-panel" style="display:none;position:fixed;z-index:8000;">
  <div class="move-detail-card">
    <div class="move-detail-head">
      <div class="move-detail-title">
        <span id="move-detail-name" class="move-detail-name"></span>
        <span id="move-detail-type"></span>
        <span id="move-detail-cat"></span>
      </div>
      <button id="move-detail-close" class="icon-btn" type="button" title="Schließen">&#215;</button>
    </div>
    <div id="move-detail-stats" class="move-detail-stats"></div>
    <div id="move-detail-desc" class="move-detail-desc"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
