<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- PWA: Homescreen-App + Offline -->
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0d0f2b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PokéHub">
  <link rel="apple-touch-icon" href="../icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="../icons/splash-1320x2868.png">
  <link rel="apple-touch-startup-image" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="../icons/splash-1260x2736.png">
  <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="../icons/splash-1206x2622.png">
  <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="../icons/splash-1290x2796.png">
  <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="../icons/splash-1179x2556.png">
  <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="../icons/splash-1284x2778.png">
  <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="../icons/splash-1170x2532.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="../icons/splash-1125x2436.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="../icons/splash-1242x2688.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="../icons/splash-828x1792.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="../icons/splash-750x1334.png">
  <script src="../pwa.js"></script>
  <title>Pokémon Karte – Kanto</title>
  <style>
    :root {
      --color-bg: #0d0f2b;
      --color-surface: #191b3a;
      --color-text: #e0e8f9;
      --color-accent: #ffda08;
      --color-accent-strong: #57d2ff;
      --color-muted: #b1b3cc;
      --color-border: #303258;
      --radius: 12px;
      --font-main: 'Segoe UI', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: var(--font-main);
      background: #0d0f2b;
      color: var(--color-text);
      overflow: hidden;
    }

    /* ── HEADER ── */
    #header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
      height: 56px;
      z-index: 10;
    }

    #header a.back {
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: var(--color-muted);
      font-size: 0.88rem;
      transition: color 0.2s;
      white-space: nowrap;
    }
    #header a.back:hover { color: var(--color-accent-strong); }
    #header a.back svg { flex-shrink: 0; }

    #header h1 {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
      flex: 1;
    }
    #header h1 span {
      background: linear-gradient(90deg, var(--color-accent), var(--color-accent-strong));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .game-btns {
      display: flex;
      gap: 8px;
    }
    .game-btn {
      padding: 5px 14px;
      border-radius: 999px;
      border: 1px solid var(--color-border);
      background: transparent;
      color: var(--color-muted);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-main);
      transition: all 0.2s;
    }
    .game-btn.active {
      background: rgba(255,218,8,0.15);
      border-color: rgba(255,218,8,0.5);
      color: var(--color-accent);
    }
    .game-btn:not(.active):hover {
      border-color: var(--color-muted);
      color: var(--color-text);
    }

    /* ── BODY ── */
    #body {
      display: flex;
      height: calc(100vh - 56px);
      overflow: hidden;
    }

    /* ── MAP PANE ── */
    #map-pane {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    #map {
      width: 100%;
      height: 100%;
    }

    /* ── DETAIL PANEL ── */
    #detail-panel {
      width: 340px;
      flex-shrink: 0;
      background: var(--color-surface);
      border-left: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #panel-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      color: var(--color-muted);
      text-align: center;
      padding: 32px;
    }
    #panel-empty .empty-icon { font-size: 2.5rem; opacity: 0.5; }
    #panel-empty p { font-size: 0.9rem; opacity: 0.7; }

    #panel-content {
      display: none;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }
    #panel-content.visible { display: flex; }

    #panel-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }
    #panel-location-name {
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
    }
    #panel-location-type {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .type-city { background: rgba(255,218,8,0.15); color: var(--color-accent); border: 1px solid rgba(255,218,8,0.3); }
    .type-route { background: rgba(87,210,255,0.12); color: var(--color-accent-strong); border: 1px solid rgba(87,210,255,0.25); }
    .type-special { background: rgba(112,56,248,0.15); color: #b48fff; border: 1px solid rgba(112,56,248,0.3); }

    #panel-desc {
      padding: 10px 20px 0;
      font-size: 0.82rem;
      color: var(--color-muted);
      line-height: 1.5;
      flex-shrink: 0;
    }

    /* ── TABS ── */
    #panel-tabs {
      display: flex;
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
      padding: 0 12px;
      gap: 2px;
      margin-top: 8px;
    }
    .tab-btn {
      padding: 8px 10px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--color-muted);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-main);
      transition: all 0.2s;
      white-space: nowrap;
    }
    .tab-btn:hover { color: var(--color-text); }
    .tab-btn.active {
      color: var(--color-accent-strong);
      border-bottom-color: var(--color-accent-strong);
    }

    /* ── TAB CONTENT ── */
    #panel-tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
    }
    #panel-tab-content::-webkit-scrollbar { width: 5px; }
    #panel-tab-content::-webkit-scrollbar-track { background: transparent; }
    #panel-tab-content::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 4px; }

    .no-data {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      color: var(--color-muted);
      font-size: 0.85rem;
      opacity: 0.6;
      gap: 8px;
      text-align: center;
    }
    .no-data-icon { font-size: 1.8rem; }

    /* Wild Pokémon */
    .wild-section-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-muted);
      margin: 10px 0 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--color-border);
    }
    .wild-section-title:first-child { margin-top: 0; }

    .pokemon-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 8px;
      border-radius: 8px;
      transition: background 0.15s;
      margin-bottom: 2px;
    }
    .pokemon-row:hover { background: rgba(255,255,255,0.04); }

    .poke-sprite {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      image-rendering: pixelated;
      background: rgba(255,255,255,0.03);
      border-radius: 6px;
    }
    .poke-info { flex: 1; min-width: 0; }
    .poke-name {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--color-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .poke-level {
      font-size: 0.75rem;
      color: var(--color-muted);
    }
    .rate-badge {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .rate-haeufig { background: rgba(72,200,100,0.15); color: #4ec864; border: 1px solid rgba(72,200,100,0.25); }
    .rate-selten  { background: rgba(255,218,8,0.12); color: var(--color-accent); border: 1px solid rgba(255,218,8,0.25); }
    .rate-sehr-selten { background: rgba(180,143,255,0.15); color: #b48fff; border: 1px solid rgba(180,143,255,0.25); }

    /* Items */
    .item-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 8px;
      border-radius: 8px;
      transition: background 0.15s;
      margin-bottom: 2px;
    }
    .item-row:hover { background: rgba(255,255,255,0.04); }
    .item-icon { font-size: 1.3rem; flex-shrink: 0; width: 28px; text-align: center; margin-top: 1px; }
    .item-info { flex: 1; min-width: 0; }
    .item-name { font-size: 0.88rem; font-weight: 600; color: var(--color-text); }
    .item-desc { font-size: 0.76rem; color: var(--color-muted); line-height: 1.4; margin-top: 2px; }
    .item-badge {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .badge-once { background: rgba(255,100,100,0.12); color: #ff7070; border: 1px solid rgba(255,100,100,0.25); }
    .badge-repeat { background: rgba(87,210,255,0.1); color: var(--color-accent-strong); border: 1px solid rgba(87,210,255,0.2); }

    /* Trainers */
    .trainer-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--color-border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      transition: border-color 0.2s;
    }
    .trainer-card:hover { border-color: rgba(87,210,255,0.25); }
    .trainer-card.gym-leader {
      border-left: 3px solid var(--color-accent);
      background: rgba(255,218,8,0.03);
    }
    .trainer-card.elite { border-left: 3px solid #b48fff; background: rgba(180,143,255,0.03); }
    .trainer-card.rival { border-left: 3px solid var(--color-accent-strong); }
    .trainer-card.rocket { border-left: 3px solid #ff5050; background: rgba(255,80,80,0.03); }

    .trainer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .trainer-class-name { font-size: 0.88rem; font-weight: 700; color: var(--color-text); }
    .trainer-class-name span { font-weight: 400; color: var(--color-muted); margin-left: 4px; }
    .trainer-boss-badge {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
    }
    .badge-gym { background: rgba(255,218,8,0.15); color: var(--color-accent); border: 1px solid rgba(255,218,8,0.3); }
    .badge-elite { background: rgba(180,143,255,0.15); color: #b48fff; border: 1px solid rgba(180,143,255,0.3); }
    .badge-rival-b { background: rgba(87,210,255,0.12); color: var(--color-accent-strong); border: 1px solid rgba(87,210,255,0.25); }
    .badge-rocket-b { background: rgba(255,80,80,0.12); color: #ff7070; border: 1px solid rgba(255,80,80,0.25); }

    .trainer-badge-name {
      font-size: 0.76rem;
      color: var(--color-accent);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .trainer-team {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .team-pokemon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      background: rgba(255,255,255,0.04);
      border-radius: 8px;
      padding: 4px 6px;
      min-width: 52px;
    }
    .team-poke-sprite {
      width: 36px;
      height: 36px;
      image-rendering: pixelated;
    }
    .team-poke-name { font-size: 0.62rem; color: var(--color-muted); text-align: center; white-space: nowrap; }
    .team-poke-level { font-size: 0.62rem; color: var(--color-accent-strong); font-weight: 700; }

    /* Story */
    .story-item {
      display: flex;
      gap: 10px;
      padding: 8px 8px;
      border-radius: 8px;
      transition: background 0.15s;
      margin-bottom: 2px;
      align-items: flex-start;
    }
    .story-item:hover { background: rgba(255,255,255,0.04); }
    .story-icon { font-size: 1.1rem; flex-shrink: 0; width: 24px; text-align: center; }
    .story-text { font-size: 0.84rem; color: var(--color-text); line-height: 1.5; }

    /* ── TOOLTIP ── */
    #tooltip {
      position: fixed;
      background: rgba(25,27,58,0.96);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--color-text);
      pointer-events: none;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.15s;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    #tooltip.visible { opacity: 1; }
    #tooltip .tt-type {
      font-size: 0.7rem;
      font-weight: 400;
      color: var(--color-muted);
      display: block;
    }


    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--color-bg); }
    ::-webkit-scrollbar-thumb { background: var(--color-accent); border-radius: 6px; }
    * { scrollbar-width: thin; scrollbar-color: var(--color-accent) var(--color-bg); }


    /* ── LEAFLET OVERRIDES ── */
    .leaflet-container {
      background: #0d0f2b !important;
      font-family: var(--font-main);
    }
    .kanto-map-image { image-rendering: pixelated; }

    /* Zoom control */
    .leaflet-control-zoom {
      border: 1px solid var(--color-border) !important;
      border-radius: 8px !important;
      overflow: hidden;
    }
    .leaflet-control-zoom a {
      background: var(--color-surface) !important;
      color: var(--color-text) !important;
      border-bottom: 1px solid var(--color-border) !important;
      width: 30px !important;
      height: 30px !important;
      line-height: 30px !important;
      font-size: 16px !important;
      transition: background 0.15s !important;
    }
    .leaflet-control-zoom a:last-child { border-bottom: none !important; }
    .leaflet-control-zoom a:hover { background: rgba(255,255,255,0.08) !important; color: #fff !important; }
    .leaflet-control-zoom-in  { border-radius: 8px 8px 0 0 !important; }
    .leaflet-control-zoom-out { border-radius: 0 0 8px 8px !important; }

    /* City circle markers */
    .map-city-circle {
      transition: fill 0.15s, stroke 0.15s;
      cursor: pointer;
    }
    .map-city-circle.selected { fill: #fff !important; filter: drop-shadow(0 0 6px #ffda08); }

    /* Route area rectangles */
    .map-route-rect { cursor: pointer; }

    /* Special location markers */
    .map-special-marker {
      cursor: pointer;
      transition: fill 0.15s;
    }
    .map-special-marker.selected { fill: #fff !important; filter: drop-shadow(0 0 6px #57d2ff); }

    /* Leaflet tooltips (used as permanent labels) */
    .leaflet-tooltip {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      pointer-events: none !important;
      white-space: nowrap;
    }
    .leaflet-tooltip::before { display: none !important; }
    .leaflet-tooltip-city {
      font-size: 10px;
      font-weight: 600;
      color: var(--color-text);
      text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 0 6px rgba(0,0,0,0.7);
    }
    .leaflet-tooltip-special {
      font-size: 8.5px;
      font-weight: 600;
      color: var(--color-muted);
      text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 0 6px rgba(0,0,0,0.7);
    }

    /* ── MAP CONTROLS OVERLAY ── */
    #map-controls {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    #map-controls > * { pointer-events: auto; }

    #search-wrap {
      position: relative;
      width: 220px;
    }
    #map-search {
      width: 100%;
      padding: 8px 12px 8px 34px;
      background: rgba(25,27,58,0.95);
      border: 1px solid var(--color-border);
      border-radius: 999px;
      color: var(--color-text);
      font-size: 0.82rem;
      font-family: var(--font-main);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      backdrop-filter: blur(8px);
    }
    #map-search:focus {
      border-color: rgba(87,210,255,0.5);
      box-shadow: 0 0 0 3px rgba(87,210,255,0.12);
    }
    #map-search::placeholder { color: var(--color-muted); opacity: 0.7; }
    #search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-muted);
      font-size: 14px;
      pointer-events: none;
    }
    #search-results {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: rgba(25,27,58,0.97);
      border: 1px solid var(--color-border);
      border-radius: 10px;
      overflow: hidden;
      max-height: 220px;
      overflow-y: auto;
      backdrop-filter: blur(8px);
    }
    #search-results:empty { display: none; }
    .search-result-item {
      padding: 8px 14px;
      cursor: pointer;
      font-size: 0.82rem;
      transition: background 0.1s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-result-item:hover { background: rgba(255,255,255,0.07); }
    .search-result-item .res-type {
      font-size: 0.68rem;
      color: var(--color-muted);
      opacity: 0.8;
    }

    #filter-row {
      display: flex;
      gap: 6px;
    }
    .filter-chip {
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid var(--color-border);
      background: rgba(25,27,58,0.9);
      color: var(--color-muted);
      font-size: 0.73rem;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-main);
      transition: all 0.2s;
      backdrop-filter: blur(6px);
    }
    .filter-chip.active { color: var(--color-accent); border-color: rgba(255,218,8,0.4); background: rgba(255,218,8,0.1); }
    .filter-chip[data-filter="routes"].active { color: var(--color-accent-strong); border-color: rgba(87,210,255,0.4); background: rgba(87,210,255,0.1); }
    .filter-chip[data-filter="special"].active { color: #b48fff; border-color: rgba(112,56,248,0.4); background: rgba(112,56,248,0.1); }

  </style>
  <link rel="stylesheet" href="../vendor/leaflet/leaflet.css"/>
  <script src="../vendor/leaflet/leaflet.js"></script>
</head>
<body>

<!-- TOOLTIP -->
<div id="tooltip"><span class="tt-name"></span><span class="tt-type"></span></div>

<!-- HEADER -->
<div id="header">
  <a href="../index.html" class="back">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Hub
  </a>
  <h1>Pokémon <span>Karte</span></h1>
  <div class="game-btns">

function ll(svgX, svgY) { return [IMG_H - svgY, svgX]; }
function llRect(x, y, w, h) { return [[IMG_H - (y + h), x], [IMG_H - y, x + w]]; }

function attachCityEvents(layer, id) {
  layer.on('mouseover', e => { if (id !== selectedId) layer.setStyle(CITY_HOVER); showTooltip(e.originalEvent, id); });
  layer.on('mousemove', e => moveTooltip(e.originalEvent));
  layer.on('mouseout',  () => { if (id !== selectedId) layer.setStyle(CITY_DEFAULT); hideTooltip(); });
  layer.on('click',     () => selectLocation(id, layer, 'city'));
}

function attachRouteEvents(layer, id) {
  layer.on('mouseover', e => { if (id !== selectedId) layer.setStyle(ROUTE_HOVER); showTooltip(e.originalEvent, id); });
  layer.on('mousemove', e => moveTooltip(e.originalEvent));
  layer.on('mouseout',  () => { if (id !== selectedId) layer.setStyle(ROUTE_DEFAULT); hideTooltip(); });
  layer.on('click',     () => selectLocation(id, layer, 'route'));
}

function attachSpecialEvents(layer, id) {
  layer.on('mouseover', e => { if (id !== selectedId) layer.setStyle(SPEC_HOVER); showTooltip(e.originalEvent, id); });
  layer.on('mousemove', e => moveTooltip(e.originalEvent));
  layer.on('mouseout',  () => { if (id !== selectedId) layer.setStyle(SPEC_DEFAULT); hideTooltip(); });
  layer.on('click',     () => selectLocation(id, layer, 'special'));
}

function selectLocation(id, layer, type) {
  if (selectedLayer && selectedId !== id) {
    const prevType = selectedLayer._locationType;
    if (prevType === 'city')    selectedLayer.setStyle(CITY_DEFAULT);
    if (prevType === 'route')   selectedLayer.setStyle(ROUTE_DEFAULT);
    if (prevType === 'special') selectedLayer.setStyle(SPEC_DEFAULT);
  }
  selectedId = id;
  selectedLayer = layer;
  if (type === 'city')    layer.setStyle(CITY_SELECTED);
  if (type === 'route')   layer.setStyle(ROUTE_SELECTED);
  if (type === 'special') layer.setStyle(SPEC_SELECTED);
  const center = type === 'route' ? layer.getBounds().getCenter() : layer.getLatLng();
  leafletMap.panTo(center, { animate: true, duration: 0.4 });
  showPanel(id);
}

const tooltip = document.getElementById('tooltip');
const ttName  = tooltip.querySelector('.tt-name');
const ttType  = tooltip.querySelector('.tt-type');

function showTooltip(e, id) {
  const loc = DATA.locations[id];
  if (!loc) return;
  ttName.textContent = loc.name;
  ttType.textContent = loc.type;
  tooltip.classList.add('visible');
  moveTooltip(e);
}

function moveTooltip(e) {
  let x = e.clientX + 14, y = e.clientY - 10;
  if (x + 160 > window.innerWidth) x = e.clientX - 170;
  if (y + 50 > window.innerHeight) y = e.clientY - 55;
  tooltip.style.left = x + 'px';
  tooltip.style.top  = y + 'px';
}

function hideTooltip() { tooltip.classList.remove('visible'); }

// SEARCH
// ─────────────────────────────────────────────
const searchInput   = document.getElementById('map-search');
const searchResults = document.getElementById('search-results');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  searchResults.innerHTML = '';
  if (!q) { searchResults.style.display = 'none'; return; }
  const matches = Object.entries(DATA.locations).filter(([, loc]) => loc.name.toLowerCase().includes(q));
  if (matches.length === 0) { searchResults.style.display = 'none'; return; }
  matches.slice(0, 8).forEach(([id, loc]) => {
    const item = document.createElement('div');
    item.className = 'search-result-item';
    item.innerHTML = `<span>${loc.name}</span><span class="res-type">${loc.type}</span>`;
    item.addEventListener('click', () => {
      searchInput.value = '';
      searchResults.style.display = 'none';
      focusLocation(id);
    });
    searchResults.appendChild(item);
  });
  searchResults.style.display = 'block';
});

document.addEventListener('click', e => {
  if (!document.getElementById('search-wrap').contains(e.target))
    searchResults.style.display = 'none';
});

function focusLocation(id) {
  let found = null;
  cityGroup.eachLayer(l => { if (l._locationId === id) found = l; });
  specialGroup.eachLayer(l => { if (l._locationId === id) found = l; });
  routeGroup.eachLayer(l => { if (l._locationId === id) found = l; });
  if (!found) return;
  const type = found._locationType;
  selectLocation(id, found, type);
  const center = type === 'route' ? found.getBounds().getCenter() : found.getLatLng();
  leafletMap.flyTo(center, Math.max(leafletMap.getZoom(), type === 'route' ? 0 : 0.5), { animate: true, duration: 0.6 });
}

// ─────────────────────────────────────────────
// FILTER CHIPS
// ─────────────────────────────────────────────
document.querySelectorAll('.filter-chip').forEach(btn => {
  btn.addEventListener('click', () => {
    btn.classList.toggle('active');
    const f = btn.dataset.filter;
    const active = btn.classList.contains('active');
    if (f === 'cities')  active ? cityGroup.addTo(leafletMap)    : leafletMap.removeLayer(cityGroup);
    if (f === 'routes')  active ? routeGroup.addTo(leafletMap)   : leafletMap.removeLayer(routeGroup);
    if (f === 'special') active ? specialGroup.addTo(leafletMap) : leafletMap.removeLayer(specialGroup);
  });
});

// ─────────────────────────────────────────────
// DETAIL PANEL
// ─────────────────────────────────────────────
const panelEmpty   = document.getElementById('panel-empty');
const panelContent = document.getElementById('panel-content');
const panelName    = document.getElementById('panel-location-name');
const panelType    = document.getElementById('panel-location-type');
const panelDesc    = document.getElementById('panel-desc');
const panelTabContent = document.getElementById('panel-tab-content');

let currentTab = 'wild';

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    if (selectedId) renderTab(selectedId, currentTab);
  });
});

function showPanel(id) {
  const loc = DATA.locations[id];
  if (!loc) return;

  panelEmpty.style.display = 'none';
  panelContent.classList.add('visible');

  panelName.textContent = loc.name;

  panelType.className = 'type-' + (loc.typeKey === 'city' ? 'city' : 'special');
  panelType.textContent = loc.type;
  if (loc.typeKey === 'route') panelType.className = 'type-route';

  panelDesc.textContent = loc.desc || '';

  // Reset to wild tab
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('[data-tab="wild"]').classList.add('active');
  currentTab = 'wild';
  renderTab(id, 'wild');
}

function renderTab(id, tab) {
  panelTabContent.innerHTML = '';
  if (tab === 'wild')     renderWild(id);
  else if (tab === 'items')    renderItems(id);
  else if (tab === 'trainers') renderTrainers(id);
  else if (tab === 'story')    renderStory(id);
}

// ── WILD POKEMON ──
function renderWild(id) {
  const data = DATA.wild[id];
  if (!data || (!data.grass && !data.water && !data.cave)) {
    noData('Keine wilden Pokémon bekannt.');
    return;
  }

  const sections = [
    { key: 'grass', label: 'Im Gras', icon: '🌿' },
    { key: 'water', label: 'Surfen/Angeln', icon: '🌊' },
    { key: 'cave',  label: 'In der Höhle', icon: '🪨' },
  ];

  let hasAny = false;
  sections.forEach(({ key, label, icon }) => {
    const list = data[key];
    if (!list || list.length === 0) return;
    hasAny = true;

    const title = document.createElement('div');
    title.className = 'wild-section-title';
    title.textContent = icon + ' ' + label;
    panelTabContent.appendChild(title);

    list.forEach(p => {
      const row = document.createElement('div');
      row.className = 'pokemon-row';
      const rateClass = p.rate === 'häufig' ? 'rate-haeufig' : p.rate === 'selten' ? 'rate-selten' : 'rate-sehr-selten';
      row.innerHTML = `
        <img class="poke-sprite" src="${SPRITE_BASE}${p.id}.png" alt="${p.name}" loading="lazy" onerror="this.style.opacity='0.3'">
        <div class="poke-info">
          <div class="poke-name">${p.name}</div>
          <div class="poke-level">Level ${p.minLv}–${p.maxLv}</div>
        </div>
        <span class="rate-badge ${rateClass}">${p.rate}</span>
      `;
      panelTabContent.appendChild(row);
    });
  });

  if (!hasAny) noData('Keine wilden Pokémon bekannt.');
}

// ── ITEMS ──
function renderItems(id) {
  const list = DATA.items[id];
  if (!list || list.length === 0) {
    noData('Keine versteckten Items bekannt.');
    return;
  }
  list.forEach(item => {
    const row = document.createElement('div');
    row.className = 'item-row';
    const badgeClass = item.once ? 'badge-once' : 'badge-repeat';
    const badgeText  = item.once ? 'einmalig' : 'wiederholbar';
    row.innerHTML = `
      <div class="item-icon">${item.item}</div>
      <div class="item-info">
        <div class="item-name">${item.name}</div>
        <div class="item-desc">${item.desc}</div>
      </div>
      <span class="item-badge ${badgeClass}">${badgeText}</span>
    `;
    panelTabContent.appendChild(row);
  });
}

// ── TRAINERS ──
function renderTrainers(id) {
  const list = DATA.trainers[id];
  if (!list || list.length === 0) {
    noData('Keine Trainer-Daten verfügbar.');
    return;
  }
  list.forEach(trainer => {
    const card = document.createElement('div');
    card.className = 'trainer-card';
    if (trainer.bossType === 'gym')    card.classList.add('gym-leader');
    if (trainer.bossType === 'elite')  card.classList.add('elite');
    if (trainer.bossType === 'rival')  card.classList.add('rival');
    if (trainer.bossType === 'rocket') card.classList.add('rocket');

    let badgeHTML = '';
    if (trainer.bossType === 'gym')    badgeHTML = `<span class="trainer-boss-badge badge-gym">Arenaleiter</span>`;
    if (trainer.bossType === 'elite')  badgeHTML = `<span class="trainer-boss-badge badge-elite">Top Vier</span>`;
    if (trainer.bossType === 'rival')  badgeHTML = `<span class="trainer-boss-badge badge-rival-b">Rivale</span>`;
    if (trainer.bossType === 'rocket') badgeHTML = `<span class="trainer-boss-badge badge-rocket-b">Team Rocket</span>`;
    if (trainer.class === 'Champion')  badgeHTML = `<span class="trainer-boss-badge badge-elite">Champion</span>`;

    let badgeNameHTML = '';
    if (trainer.badge) {
      badgeNameHTML = `<div class="trainer-badge-name">🏅 ${trainer.badge}</div>`;
    }

    const teamHTML = trainer.team.map(p => `
      <div class="team-pokemon">
        <img class="team-poke-sprite" src="${SPRITE_BASE}${p.id}.png" alt="${p.name}" loading="lazy" onerror="this.style.opacity='0.2'">
        <span class="team-poke-name">${p.name}</span>
        <span class="team-poke-level">Lv.${p.level}</span>
      </div>
    `).join('');

    card.innerHTML = `
      <div class="trainer-header">
        <div class="trainer-class-name">${trainer.class}<span>${trainer.name}</span></div>
        ${badgeHTML}
      </div>
      ${badgeNameHTML}
      <div class="trainer-team">${teamHTML}</div>
    `;
    panelTabContent.appendChild(card);
  });
}

// ── STORY ──
function renderStory(id) {
  const list = DATA.story[id];
  if (!list || list.length === 0) {
    noData('Keine Story-Ereignisse bekannt.');
    return;
  }
  list.forEach(event => {
    const item = document.createElement('div');
    item.className = 'story-item';
    item.innerHTML = `
      <span class="story-icon">${event.icon}</span>
      <span class="story-text">${event.text}</span>
    `;
    panelTabContent.appendChild(item);
  });
}

// ── NO DATA ──
function noData(msg) {
  panelTabContent.innerHTML = `
    <div class="no-data">
      <div class="no-data-icon">📭</div>
      <div>Keine Daten verfügbar</div>
      <div style="font-size:0.75rem;opacity:0.6">${msg}</div>
    </div>
  `;
}

</script>
</body>
</html>
